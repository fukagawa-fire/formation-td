<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深川TD-8 陣形マップ</title>
<style>
:root{--bg:#f4f6f8;--fg:#1c2530;--card:#fff;--line:#cfd6dd;--ok:#d9f2dc;--ng:#f6d3d3;--boy:#3b82f6;--girl:#ec6aa5;--gold:#f5b800;--op:#e8ecf0;--pk:#d6458f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--fg:#e8edf2;--card:#1c242d;--line:#3a4653;--ok:#1f4a2a;--ng:#5a2424;--op:#26303a;--pk:#f08cc0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--fg:#e8edf2;--card:#1c242d;--line:#3a4653;--ok:#1f4a2a;--ng:#5a2424;--op:#26303a;--pk:#f08cc0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:10px}
h1{font-size:17px;margin:4px 0 8px}
.shake{display:inline-block;filter:hue-rotate(-75deg) saturate(1.4)}
.court{display:grid;grid-template-columns:1fr 1fr .6fr;grid-template-rows:auto minmax(190px,auto) auto;gap:3px;background:var(--line);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.court>div{background:var(--card);padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;position:relative;min-height:54px}
.lab{position:absolute;top:1px;left:4px;font-size:9px;opacity:.6;pointer-events:none}
#in{grid-area:2/1;flex-wrap:nowrap!important;gap:2px!important}.col{display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center;flex:1}#opp{grid-area:2/2;background:var(--op)!important;opacity:.8}#ctr{grid-area:2/3;flex-direction:column;flex-wrap:nowrap;background:var(--ok)!important}
#red1{grid-area:1/1;background:var(--ng)!important}#red2{grid-area:3/1;background:var(--ng)!important}
#top{grid-area:1/2;background:var(--ok)!important}#bot{grid-area:3/2;background:var(--ok)!important}
#cor{grid-area:1/3;background:var(--ok)!important}#corB{grid-area:3/3;background:var(--ok)!important}
.chip{width:50px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:700;color:#fff;line-height:1.05;user-select:none;z-index:2;border:3px solid transparent}
.m{background:var(--boy)}.f{background:var(--girl)}
#in .chip{cursor:pointer;box-shadow:0 0 0 2px var(--fg) inset}
.btns{display:flex;gap:8px;margin:10px 0}button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;line-height:1.7}.panel b{display:inline-block;min-width:6.5em}
.hint{font-size:12px;opacity:.7;margin:4px 0}
</style></head><body>
<h1><span class="shake">🤝</span> 深川TD-8 陣形マップ<br><small style="font-size:11px;opacity:.8;font-weight:600;color:var(--pk)">FUKAGAWA TD-8 FORMATION ｜ はるとなし ｜ v<span id="ver">1.3</span></small></h1>
<div class="hint">内野の選手をタップ ＝ 当たって外野へ。いつき＋ひなた＝センター縦2枚（縦攻撃）</div>
<div class="court">
<div id="red1"><span class="lab">進入禁止</span></div><div id="top"><span class="lab">外野：上</span></div><div id="cor"><span class="lab">カド</span></div>
<div id="in"><span class="lab">内野 後ろ(女子)｜前(男子)→</span><div class="col" id="inB"></div><div class="col" id="inF"></div></div><div id="opp"><span class="lab">相手内野</span></div><div id="ctr"><span class="lab">センター</span></div>
<div id="red2"><span class="lab">進入禁止</span></div><div id="bot"><span class="lab">外野：下</span></div><div id="corB"><span class="lab">カド</span></div>
</div>
<div class="btns"><button id="undo">↩ 一つ戻す</button><button id="reset">初期配置に戻す</button></div>
<div class="panel" id="info"></div>
<script>
/*ENGINE_START*/
const P={'ゆうき':'m','そうすけ':'m','いつき':'m','ひなた':'m','かなた':'m','つむぎ':'f','かりん':'f','ごりん':'f'};
const GIRLS=['つむぎ','かりん','ごりん'];
/* 初期外野の3人。内野が当たるたびにこの順で1人ずつ内野へ戻る（1人1回だけ） */
const ORDER=['ゆうき','そうすけ','ひなた'];
const A='いつき',HN='ひなた',CM=[A,HN],M=['かなた'],SIDES=['top','bot'],Z=['top','bot','ctr','cor','corB'];
const isF=n=>P[n]==='f';
const tier=n=>isF(n)?9:CM.includes(n)?1:M.includes(n)?2:3;
const init=()=>({inf:['いつき','かなた','つむぎ','かりん','ごりん'],top:['ゆうき'],bot:['そうすけ'],ctr:['ひなた'],cor:[],corB:[],ret:[]});
const outs=s=>Z.flatMap(z=>s[z]);
const canRet=(s,n)=>!s.ret.includes(n)&&outs(s).includes(n);
/* いつきが当たったときだけ、ひなたが先に内野へ戻る（いつき＋ひなたのペア優先）。それ以外は ORDER の順 */
const nextRet=(s,hitN)=>(hitN===A&&canRet(s,HN))?HN:(ORDER.find(n=>canRet(s,n))||null);
/* 外野の移動コスト：隣のゾーン=1、上↔下など遠い移動=3 */
const ADJ={top:['ctr','cor'],bot:['ctr','corB'],ctr:['top','bot','cor','corB'],cor:['top','ctr'],corB:['bot','ctr']};
const DIST=(a,b)=>!a||a===b?0:ADJ[a].includes(b)?1:3;
/* 外野の人数ごとの配置枠：センター最大2／上下は各最大2／7人目だけカド */
function layout(names,prev){
  const k=names.length,combos=[];
  if(k>=7){for(const cz of['cor','corB'])combos.push({ctr:2,top:2,bot:2,[cz]:1})}
  else for(let c=0;c<=2;c++)for(let t=1;t<=2;t++){const b=k-c-t;if(b>=1&&b<=2)combos.push({ctr:c,top:t,bot:b})}   /* 上・下は必ず1人以上（がら空きを作らない） */
  const idealC=k===3?1:2,idealS=Math.min(k,6)-idealC;
  let best=null,bestZ=null;
  for(const cap of combos){
    const as={},rem={...cap};
    (function rec(i){
      if(i===k){
        const zs={top:[],bot:[],ctr:[],cor:[],corB:[]};names.forEach(n=>zs[as[n]].push(n));
        const c=zs.ctr.length,t=zs.top.length,b=zs.bot.length;
        const cornerP=[...zs.cor,...zs.corB][0];
        const sc=[
          CM.filter(n=>names.includes(n)&&as[n]!=='ctr').length,      /* ①いつき・ひなたは必ずセンター */
          Math.abs(c-idealC)+Math.abs(t+b-idealS),                    /* ②人数ごとの基本配置 */
          Math.abs(t-b),                                              /* ③上下のバランス */
          zs.ctr.filter(isF).length,                                  /* ④女子はサイド優先（センターは枠が余らない時だけ） */
          Math.abs(zs.top.filter(isF).length-zs.bot.filter(isF).length), /* ⑤女子は逆サイドに分ける */
          [zs.top,zs.bot].filter(a=>a.length&&a.every(isF)).length,   /* ⑥女子だけのサイドを減らす */
          names.reduce((a,n)=>a+DIST(prev[n],as[n]),0),               /* ⑦動きが少ない方（今いる人はなるべく動かさない） */
          zs.ctr.filter(n=>!isF(n)).reduce((a,n)=>a+tier(n),0),       /* ⑧センターは強い男子（動かさずに済む範囲で） */
          cornerP?-tier(cornerP):0,                                   /* ⑨カドは一番弱い男子 */
          names.map(n=>n+as[n]).sort().join()
        ];
        if(!best||cmp(sc,best)<0){best=sc;bestZ=zs}
        return}
      for(const z of Z){
        if(!rem[z])continue;
        if((z==='cor'||z==='corB')&&isF(names[i]))continue;
        rem[z]--;as[names[i]]=z;rec(i+1);rem[z]++}
    })(0);
  }
  const o=n=>CM.indexOf(n)<0?9:CM.indexOf(n);
  bestZ.ctr.sort((x,y)=>o(x)-o(y));
  return bestZ;
}
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1}return 0}
/* 1回当たったときの処理（状態sを直接更新）。戻り値＝戻った人 */
function applyHit(s,n){
  const prev={};Z.forEach(z=>s[z].forEach(x=>prev[x]=z));
  s.inf=s.inf.filter(x=>x!==n);
  const r=nextRet(s,n);
  if(r){s.inf.push(r);s.ret.push(r);prev[n]=prev[r];delete prev[r]}
  const names=outs(s).filter(x=>x!==r).concat(n);
  const L=layout(names,prev);
  for(const z of Z)s[z]=L[z];
  return {r,prev};
}
/*ENGINE_END*/
let S=init(),H=[];
const MID='いつき';
function hit(n){
  if(S.inf.length<=1)return;
  H.push(JSON.stringify(S));
  applyHit(S,n);
  render();
}
const chips={};
for(const n in P){const c=document.createElement('div');c.className='chip '+P[n]+(n===A?' A':'');c.textContent=n;c.onclick=()=>{if(c.parentElement.classList.contains('col'))hit(n)};chips[n]=c}
function render(){
  const first={};for(const n in chips)first[n]=chips[n].getBoundingClientRect();
  const put=(id,arr)=>{const el=document.getElementById(id);arr.forEach(n=>el.appendChild(chips[n]))};
  const sd=a=>[...a].sort((x,y)=>(isF(y)-isF(x)));
  put('inB',S.inf.filter(isF));const bs=S.inf.filter(n=>!isF(n)&&n!==MID);if(S.inf.includes(MID))bs.splice(Math.floor((bs.length+1)/2),0,MID);put('inF',bs);put('top',sd(S.top));put('bot',sd(S.bot));put('ctr',S.ctr);put('cor',S.cor);put('corB',S.corB);
  for(const n in chips){const c=chips[n],b=c.getBoundingClientRect(),f=first[n];
    if(f.width&&(f.left!==b.left||f.top!==b.top))c.animate([{transform:`translate(${f.left-b.left}px,${f.top-b.top}px)`},{transform:'none'}],{duration:380,easing:'ease'})}
  info();document.getElementById('undo').disabled=!H.length;
}
function loc(n){const z=Z.find(z=>S[z].includes(n));if(!z)return'内野（待機中）';return{top:'外野・上',bot:'外野・下',ctr:'外野・センター',cor:'外野・カド（上）',corB:'外野・カド（下）'}[z]}
function info(){
  const o=outs(S).length,c=ORDER.filter(n=>!S.ret.includes(n)&&outs(S).includes(n));
  const gs=GIRLS.filter(n=>outs(S).includes(n));
  const gz=new Set(gs.map(loc));
  const gt=!gs.length?'なし（女子は内野）':gs.map(n=>n+'→'+loc(n)).join(' / ')+(gz.size===2?'　★逆サイド展開':'');
  const pair=CM.every(k=>S.ctr.includes(k));
  const tt=pair?'いつき＋ひなた センター縦2枚 成立 ★':S.ret.includes(HN)?'ひなたが内野に復帰中（ひなたが再び当たると、いつきと縦2枚）':'ひなたセンター待機 ／ いつきが当たるとひなたが内野に戻り、いつきがセンターへ';
  const cn=(S.cor[0]||S.corB[0]);
  document.getElementById('info').innerHTML=
   `<div><b>外野人数</b>${o}人 ／ 内野${S.inf.length}人</div>`+
   `<div><b>縦攻撃</b>${tt}</div>`+
   `<div><b>復帰待ち</b>${c.length?c.join(' → '):'なし（復帰枠 終了）'}</div>`+
   `<div><b>復帰のルール</b>ゆうき → そうすけ → ひなた の順に1人1回だけ（いつきが当たったときだけ、ひなたが先に戻る）。一度外野に出た人はもう戻れません</div>`+
   `<div><b>女子ルール</b>${gt}</div>`+
   `<div><b>カド配置</b>${cn?cn+'（7人目）':'なし（外野7人で発動）'}</div>`+
   (S.inf.length<=1?`<div><b>内野</b>あと1人（次に当たると試合終了）</div>`:'');
}
document.getElementById('undo').onclick=()=>{if(H.length){S=JSON.parse(H.pop());render()}};
document.getElementById('reset').onclick=()=>{S=init();H=[];render()};
render();
</script></body></html>
